<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#0b0607"><title>JARVIS · Central de Comando Kalfix</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/kalfix-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/kalfix-32.png">
<link rel="apple-touch-icon" href="/icons/kalfix-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS Kalfix">
<style>
  :root{
    --bg:#0b0607;--bg2:#050203;--panel:rgba(28,12,14,.62);--glass:rgba(30,12,14,.5);
    --line:rgba(232,32,46,.18);--line2:rgba(232,32,46,.34);
    --green:#e8202e;--neon:#ff5b64;--gold:#c7ccd3;--gold2:rgba(199,204,211,.5);
    --ink:#f4eef0;--muted:#b09aa0;--dim:#7d6b70;
    --ok:#2dff8c;--aten:#ffcc55;--crit:#ff556e;--oport:#57b6ff;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:"Segoe UI",system-ui,Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:hidden}
  #particles{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
  .app{position:relative;z-index:1;min-height:100vh;padding:10px 14px 96px;max-width:920px;margin:0 auto}
  .app::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(680px 520px at 50% 6%,rgba(232,32,46,.10),transparent 60%),radial-gradient(700px 700px at 50% 60%,rgba(232,32,46,.05),transparent 62%),linear-gradient(180deg,#140809,#050203)}

  /* Top bar */
  .bar{display:flex;align-items:center;gap:10px;padding:6px 2px 10px}
  .brand{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--muted)}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .brand b{color:var(--ink);letter-spacing:4px}
  .brand .g{color:var(--gold)}
  .spacer{flex:1}
  .select,.grpbtn{font-family:var(--mono);font-size:12px;letter-spacing:1px;border:1px solid var(--line2);background:var(--glass);color:var(--ink);border-radius:20px;padding:7px 12px;display:flex;align-items:center;gap:7px;cursor:pointer}
  .select .lab{color:var(--dim);font-size:8.5px;letter-spacing:1.5px;display:block;text-transform:uppercase}
  .select .co{color:var(--green);font-weight:700}
  .grpbtn.active{border-color:var(--green);color:var(--green);box-shadow:0 0 14px rgba(232,32,46,.25)}

  /* Group summary */
  .grpsum{display:none;gap:8px;margin:2px 0 6px;flex-wrap:wrap}
  .grpsum.show{display:flex}
  .gchip{flex:1;min-width:120px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 11px}
  .gchip .n{font-family:var(--mono);font-size:22px;line-height:1}
  .gchip .l{font-size:8.5px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;margin-top:3px}

  /* Core */
  .hero{position:relative;height:300px;display:flex;align-items:center;justify-content:center;margin:2px 0}
  .sweep{position:absolute;width:280px;height:280px;border-radius:50%}
  .ring{position:absolute;border-radius:50%;border:1px solid var(--line);left:50%;top:50%;transform:translate(-50%,-50%)}
  .r1{width:280px;height:280px;border-style:dashed}.r2{width:210px;height:210px;border-color:var(--gold2);opacity:.4}.r3{width:150px;height:150px}
  .sweep .beam{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(232,32,46,.22),transparent 30%);-webkit-mask:radial-gradient(farthest-side,transparent 40%,#000 41%);mask:radial-gradient(farthest-side,transparent 40%,#000 41%)}
  @media(prefers-reduced-motion:no-preference){.sweep .beam{animation:spin 6s linear infinite}.r1{animation:spin 90s linear infinite}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .core{position:relative;z-index:3;width:180px;height:180px;border-radius:50%;overflow:hidden;cursor:pointer;
    box-shadow:0 0 46px rgba(232,32,46,.34),inset 0 0 22px rgba(0,0,0,.5),0 0 0 2px var(--gold2)}
  .core .logoimg{width:100%;height:100%;object-fit:cover;display:block}
  .coreCap{text-align:center;margin:-6px 0 2px}
  .coreCap .tag{font-family:var(--mono);font-weight:800;font-size:17px;letter-spacing:7px;color:var(--ink);text-shadow:0 0 14px rgba(232,32,46,.5)}
  .coreCap .sub{font-size:9px;letter-spacing:3px;color:var(--gold);margin-top:2px;text-transform:uppercase}
  .coreCap .stat{font-size:8px;letter-spacing:3px;color:var(--green);margin-top:3px;font-family:var(--mono)}
  .pulse{position:absolute;width:172px;height:172px;border-radius:50%;border:1px solid var(--green);z-index:2}
  @media(prefers-reduced-motion:no-preference){.pulse{animation:pl 3.4s ease-out infinite}}
  @keyframes pl{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.7);opacity:0}}
  /* agent nodes float over hero on wide; on mobile they go to grid below */
  .agents{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:2px}
  .ag{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
  .ag:active{transform:scale(.93)}
  .ag .ic{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--green);background:radial-gradient(circle,rgba(10,40,26,.7),transparent)}
  .ag .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
  .ag b{font-size:8.5px;letter-spacing:.3px;color:var(--ink);font-weight:600;text-align:center;line-height:1.1}
  .ag .st{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%}
  .ag.on{border-color:var(--green);box-shadow:0 0 16px rgba(232,32,46,.22)}
  .ag.alert .ic{border-color:var(--crit);color:var(--crit);animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.45}}

  /* Indicators */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
  .kpi{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:10px 9px;position:relative;cursor:pointer}
  .kpi .l{font-size:8.5px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
  .kpi .v{font-family:var(--mono);font-size:15px;margin-top:5px;letter-spacing:.3px}
  .kpi .s{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%}
  .s-ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.s-aten{background:var(--aten);box-shadow:0 0 8px var(--aten)}.s-crit{background:var(--crit);box-shadow:0 0 8px var(--crit)}.s-oport{background:var(--oport);box-shadow:0 0 8px var(--oport)}.s-sem{background:var(--dim)}
  .v-ok{color:var(--ok)}.v-aten{color:var(--aten)}.v-crit{color:var(--crit)}.v-oport{color:var(--oport)}.v-sem{color:var(--dim);font-size:11px}
  @media(max-width:560px){.agents{grid-template-columns:repeat(4,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.hero{height:250px}.sweep,.r1{width:230px;height:230px}}

  /* Section title */
  .sec{margin:16px 2px 8px;display:flex;align-items:center;justify-content:space-between}
  .sec h2{margin:0;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);font-weight:700}
  .sec .c{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:1px}

  /* Feed */
  .feed{display:flex;flex-direction:column;gap:8px}
  .ev{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;cursor:pointer;border-left-width:3px;transition:transform .12s}
  .ev:active{transform:scale(.99)}
  .ev.crit{border-left-color:var(--crit)}.ev.aten{border-left-color:var(--aten)}.ev.oport{border-left-color:var(--oport)}.ev.prev{border-left-color:var(--gold)}
  .ev .tp{font-family:var(--mono);font-size:8.5px;letter-spacing:2px;text-transform:uppercase}
  .ev.crit .tp{color:var(--crit)}.ev.aten .tp{color:var(--aten)}.ev.oport .tp{color:var(--oport)}.ev.prev .tp{color:var(--gold)}
  .ev .tt{font-size:12.5px;color:var(--ink);margin-top:3px;line-height:1.35}

  /* ALERTA JARVIS (inteligência cruzada) */
  .alerta{position:relative;margin:16px 0 4px;border:1px solid var(--gold2);border-radius:15px;padding:13px 14px;cursor:pointer;overflow:hidden;
    background:linear-gradient(135deg,rgba(40,20,10,.5),rgba(26,10,10,.5)),var(--panel);box-shadow:0 0 26px rgba(212,178,106,.14),inset 0 0 22px rgba(255,90,90,.05)}
  .alerta::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--gold),var(--crit))}
  .alerta .hd{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
  .alerta .hd .pin{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:blink 1.6s infinite}
  .alerta h4{margin:7px 0 4px;font-size:14px;color:var(--ink);letter-spacing:.3px}
  .alerta p{margin:0;font-size:12px;line-height:1.45;color:var(--muted)}
  .alerta .chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .alerta .chip{display:flex;align-items:center;gap:4px;font-size:8.5px;letter-spacing:.5px;color:var(--green);border:1px solid var(--line);border-radius:12px;padding:3px 8px;font-family:var(--mono);text-transform:uppercase}
  .alerta .chip svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.7}
  .alerta .cta{margin-top:9px;font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--gold)}
  /* HOJE */
  .hoje{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .hcard{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:11px 8px;text-align:center;cursor:pointer}
  .hcard .n{font-family:var(--mono);font-size:24px;color:var(--green);line-height:1}
  .hcard .l{font-size:8px;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-top:5px;line-height:1.2}
  @media(max-width:560px){.hoje{grid-template-columns:repeat(2,1fr)}}

  /* Carteira (grupo) */
  .cart{display:none;flex-direction:column;gap:8px}
  .cart.show{display:flex}
  .crow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 13px;cursor:pointer}
  .crow .cst{width:9px;height:9px;border-radius:50%;flex:none}
  .crow .cn{font-weight:600;font-size:13px;flex:1}
  .crow .cx{font-size:9px;font-family:var(--mono);color:var(--muted);letter-spacing:1px;text-transform:uppercase}

  /* Drawer (agent/event expand) */
  .backdrop{position:fixed;inset:0;background:rgba(2,7,5,.72);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-end}
  .backdrop.show{display:flex}
  .drawer{width:100%;max-width:920px;margin:0 auto;background:linear-gradient(180deg,rgba(9,26,18,.98),rgba(4,14,9,.99));border-top:1px solid var(--line2);border-radius:20px 20px 0 0;padding:16px 16px 22px;max-height:82vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(232,32,46,.12)}
  .drawer .dh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .drawer .dh .di{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--green)}
  .drawer .dh .di svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
  .drawer .dh h3{margin:0;font-size:15px;letter-spacing:.5px;flex:1}
  .drawer .x{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px}
  .drawer .resp{font-size:13.5px;line-height:1.55;color:var(--ink);border-left:2px solid var(--green);padding:2px 0 4px 12px;min-height:24px}
  .drawer .resp.think{color:var(--muted);white-space:pre-wrap}
  .drawer .resp p{margin:6px 0}
  .drawer .resp h4{margin:12px 0 5px;font-size:13px;letter-spacing:.3px;color:var(--green);text-transform:none}
  .drawer .resp strong{color:var(--neon)}
  .drawer .resp em{color:var(--muted);font-style:italic}
  .drawer .resp ul,.drawer .resp ol{margin:5px 0 8px;padding-left:20px}
  .drawer .resp li{margin:3px 0}
  .drawer .resp code{font-family:var(--mono);font-size:12px;background:rgba(232,32,46,.1);padding:1px 4px;border-radius:4px;color:var(--green)}
  .drawer .dchart{background:rgba(8,24,16,.5);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:2px 0 12px}
  .drawer .dchart .ct{font-size:11px;letter-spacing:.4px;color:var(--muted);text-transform:uppercase}
  .drawer .dchart .cu{font-size:10.5px;color:var(--muted);margin-bottom:6px}
  .drawer .dchart svg{width:100%;height:auto;display:block;overflow:visible}
  .drawer .dchart .lg{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:10.5px;color:var(--ink)}
  .drawer .dchart .lg span{display:inline-flex;align-items:center;gap:5px}
  .drawer .dchart .lg i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .drawer .dchart.ghost{border-style:dashed}
  .drawer .dchart.ghost .cu{color:var(--dim);margin:6px 0 0;line-height:1.4}
  .drawer .resp table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
  .drawer .resp th{text-align:left;color:var(--green);border-bottom:1px solid var(--line2);padding:5px 7px;font-weight:600}
  .drawer .resp td{border-bottom:1px solid var(--line);padding:5px 7px;color:var(--ink);font-variant-numeric:tabular-nums}
  .drawer .think{color:var(--muted);font-family:var(--mono);font-size:11px}
  .drawer .qs{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .drawer .qs button{font-family:inherit;font-size:11px;color:var(--ink);background:rgba(8,24,16,.6);border:1px solid var(--line);border-radius:16px;padding:7px 11px;cursor:pointer}

  /* bottom voice bar */
  .voicebar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(4,14,9,.4),rgba(3,9,6,.96));border-top:1px solid var(--line)}
  .voicebar .txt{flex:1;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .voicebar .txt b{color:var(--green)}
  .mic{width:54px;height:54px;flex:none;border-radius:50%;border:1px solid var(--green);background:radial-gradient(circle,rgba(232,32,46,.22),rgba(4,12,8,.95));display:grid;place-items:center;cursor:pointer;box-shadow:0 0 20px rgba(232,32,46,.4)}
  .mic svg{width:24px;height:24px;stroke:var(--green);fill:none;stroke-width:1.8}
  .mic.rec{animation:mp 1s infinite}@keyframes mp{50%{box-shadow:0 0 30px rgba(232,32,46,.8)}}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(16px);background:rgba(9,26,18,.98);border:1px solid var(--green);border-radius:10px;padding:10px 16px;font-family:var(--mono);font-size:11.5px;color:var(--neon);opacity:0;transition:.25s;z-index:60;max-width:88vw;text-align:center;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .note{margin:14px 2px 0;font-size:9px;color:var(--dim);font-family:var(--mono);text-align:center;letter-spacing:.3px}
  /* dashboard / graficos */
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 2px}
  @media(max-width:560px){.charts{grid-template-columns:1fr}}
  .chart{background:linear-gradient(180deg,rgba(9,26,18,.55),rgba(4,12,8,.6));border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;cursor:pointer;transition:.2s}
  .chart:hover{border-color:var(--line2);box-shadow:0 0 22px rgba(232,32,46,.1)}
  .chart .ct{font-size:11px;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
  .chart .cv{font-size:16px;font-weight:600;color:var(--neon);font-variant-numeric:tabular-nums;margin-bottom:8px}
  .chart .cv small{font-size:10.5px;color:var(--muted);font-weight:400;letter-spacing:.3px}
  .chart svg{width:100%;height:auto;display:block;overflow:visible}
  .chart .cta{margin-top:8px;font-family:var(--mono);font-size:9.5px;color:var(--gold);letter-spacing:.4px}
  .chart .lg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:10.5px;color:var(--ink)}
  .chart .lg span{display:inline-flex;align-items:center;gap:5px}
  .chart .lg i{width:9px;height:9px;border-radius:2px;display:inline-block}
</style></head><body>
<canvas id="particles"></canvas>
<div class="app">
  <div class="bar">
    <div class="brand"><span class="dot"></span><b>KAL<span class="g">F</span>IX</b></div>
    <div class="spacer"></div>
    <div class="select" id="selEmpresa"><div><span class="lab">Empresa ativa</span><span class="co" id="coName">SKAL</span></div><span style="color:var(--muted)">▾</span></div>
    <div class="grpbtn" id="grpBtn">GRUPO</div>
  </div>

  <div class="grpsum" id="grpSum"></div>

  <!-- CARTEIRA (visão grupo) -->
  <div class="cart" id="cart"></div>

  <!-- VISÃO EMPRESA -->
  <div id="empView">
    <div class="hero">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>

  /* ---------- Markdown -> HTML (respostas ricas do JARVIS) ---------- */
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,'$1<em>$2</em>').replace(/`(.+?)`/g,'<code>$1</code>');}
  function md(t){var L=String(t||'').split(/\r?\n/),o=[],i=0;
    function cells(ln){var a=ln.split('|').map(function(c){return c.trim();});if(a.length&&a[0]==='')a.shift();if(a.length&&a[a.length-1]==='')a.pop();return a;}
    while(i<L.length){var ln=L[i];
      if(/\|/.test(ln)&&i+1<L.length&&/^[\s|:\-]+$/.test(L[i+1])&&/-/.test(L[i+1])){var h=cells(ln);i+=2;var rows=[];while(i<L.length&&/\|/.test(L[i])){rows.push(cells(L[i]));i++;}
        o.push('<table><tr>'+h.map(function(x){return '<th>'+inl(x)+'</th>';}).join('')+'</tr>'+rows.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+inl(x)+'</td>';}).join('')+'</tr>';}).join('')+'</table>');continue;}
      var m=ln.match(/^\s*#{1,6}\s+(.*)/);if(m){o.push('<h4>'+inl(m[1])+'</h4>');i++;continue;}
      if(/^\s*[-*]\s+/.test(ln)){var u=[];while(i<L.length&&/^\s*[-*]\s+/.test(L[i])){u.push('<li>'+inl(L[i].replace(/^\s*[-*]\s+/,''))+'</li>');i++;}o.push('<ul>'+u.join('')+'</ul>');continue;}
      if(/^\s*\d+[.)]\s+/.test(ln)){var n=[];while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i])){n.push('<li>'+inl(L[i].replace(/^\s*\d+[.)]\s+/,''))+'</li>');i++;}o.push('<ol>'+n.join('')+'</ol>');continue;}
      if(/^\s*$/.test(ln)){i++;continue;}
      var p=[ln];i++;while(i<L.length&&!/^\s*$/.test(L[i])&&!/^\s*[-*]\s+/.test(L[i])&&!/^\s*\d+[.)]\s+/.test(L[i])&&!/^\s*#{1,6}\s+/.test(L[i])&&!/\|/.test(L[i])){p.push(L[i]);i++;}
      o.push('<p>'+inl(p.join(' '))+'</p>');}
    return o.join('');}

    if(!c.dados){el.innerHTML='<div class="kpi" style="grid-column:1/-1;cursor:default"><div class="l">'+c.nome+'</div><div class="v" style="font-size:13px;color:var(--muted)">Aguardando dados — envie o ACOMPCOB/extrato e eu ativo esta empresa.</div></div>';return;}
    c.kpis.forEach(function(k){var d=document.createElement('div');d.className='kpi';d.innerHTML='<span class="s s-'+k.st+'"></span><div class="l">'+k.l+'</div><div class="v v-'+k.st+'">'+k.v+'</div>';
      d.onclick=function(){openDrawer('fin',k.l+' · '+c.nome,'Explique o indicador '+k.l+' da '+c.nome+' hoje: valor, o que significa e o que fazer.',[]);};el.appendChild(d);});
  }
  function renderAgents(){
    var c=co(),el=$('agents');el.innerHTML='';var alerts=c.alertAgents||[];
    AGENTS.forEach(function(a){var d=document.createElement('div');d.className='ag'+(alerts.indexOf(a[0])>=0?' alert':'');
      d.innerHTML='<div class="ic"><svg viewBox="0 0 24 24">'+(ICON[a[0]]||ICON.est2)+'</svg></div><b>'+a[1]+'</b>'+(alerts.indexOf(a[0])>=0?'<span class="st" style="background:var(--crit);box-shadow:0 0 8px var(--crit)"></span>':'');
      d.onclick=function(){
        if(!c.dados){openDrawer(a[0],a[1]+' · '+c.nome,'Ainda não tenho dados da '+c.nome+'. O que eu precisaria para ativar e gerar o relatório da área de '+a[1]+'?',[]);return;}
        var rep='Gere o RELATÓRIO da área de '+a[1]+' da '+c.nome+', focando no que é da alçada de '+a[1]+'. Estruture como relatório com títulos: **Situação atual** (com os números reais que você tem), **Interpretação** (o que significam), **Riscos e pendências** e **Recomendações priorizadas**. Se faltar dado para esta área, diga o que falta em vez de inventar. Ponto de partida: '+a[2];
        openDrawer(a[0],'Relatório · '+a[1]+' · '+c.nome,rep,[
          {label:'🔮 Projeção',q:'Projete os próximos 3 a 6 meses da área de '+a[1]+' da '+c.nome+', com premissas explícitas e cenários.'},
          {label:'⚠️ Riscos',q:'Quais os principais riscos em '+a[1]+' da '+c.nome+' e como preveni-los? Priorize por impacto em reais.'},
          {label:'✅ Ações de hoje',q:'Sobre '+a[1]+' da '+c.nome+', quais as ações recomendadas para hoje, priorizadas?'}
        ],chartFor(a[0]));};
      el.appendChild(d);});
  }
  function renderFeed(){
    var c=co();$('evCount').textContent=c.dados?(c.eventos.length+' eventos'):'';
    var el=$('feed');el.innerHTML='';
    if(!c.dados){el.innerHTML='<div class="ev" style="cursor:default;border-left-color:var(--dim)"><div class="tp" style="color:var(--dim)">Sem dados</div><div class="tt">Assim que você enviar os dados da '+c.nome+', o JARVIS passa a identificar eventos automaticamente aqui.</div></div>';return;}
    c.eventos.forEach(function(e){var d=document.createElement('div');d.className='ev '+e.t;d.innerHTML='<div class="tp">'+e.tp+'</div><div class="tt">'+e.tt+'</div>';
      d.onclick=function(){openDrawer('comp',e.tp+' · '+c.nome,e.q,[{label:'Ação recomendada',q:e.q+' Qual a ação recomendada?'}]);};el.appendChild(d);});
  }
  function renderHoje(){
    var c=co(),el=$('hoje');el.innerHTML='';
    if(!c.dados||!c.hoje){el.style.display='none';return;}el.style.display='grid';
    var items=[['decisoes',c.hoje.decisoes,'Decisões recomendadas'],['riscos',c.hoje.riscos,'Riscos prioritários'],['pendencias',c.hoje.pendencias,'Pendências críticas'],['oportunidades',c.hoje.oportunidades,'Oportunidades']];
    items.forEach(function(it){var d=document.createElement('div');d.className='hcard';d.innerHTML='<div class="n">'+it[1]+'</div><div class="l">'+it[2]+'</div>';
      d.onclick=function(){drawer.innerHTML='<div class="dh"><div class="di"><svg viewBox="0 0 24 24">'+ICON.dir+'</svg></div><h3>'+it[2]+' · '+c.nome+'</h3><button class="x">✕</button></div><div class="resp">'+c.hoje.det[it[0]]+'</div>';backdrop.classList.add('show');drawer.querySelector('.x').onclick=closeDrawer;speak(it[2]+' da '+c.nome+'. '+c.hoje.det[it[0]].replace(/\n/g,' '));};
      el.appendChild(d);});
  }
  function renderNote(){$('note').textContent=co().nota||'';}
  function renderAlerta(){
    var c=co(),el=$('alertaWrap');el.innerHTML='';
    if(!c.dados||!c.alerta)return;var a=c.alerta;
    var chips=(a.chips||[]).map(function(ch){return '<span class="chip"><svg viewBox="0 0 24 24">'+(ICON[ch[0]]||ICON.est2)+'</svg>'+ch[1]+'</span>';}).join('');
    var d=document.createElement('div');d.className='alerta';
    d.innerHTML='<div class="hd"><span class="pin"></span>Alerta JARVIS · inteligência cruzada</div><h4>'+a.tit+'</h4><p>'+a.txt+'</p><div class="chips">'+chips+'</div><div class="cta">Toque para o diagnóstico e as ações ›</div>';
    d.onclick=function(){openDrawer('est2','Alerta JARVIS · '+c.nome,a.q,[{label:'Em quanto tempo aperta?',q:'Sobre a pressão de caixa combinada da '+c.nome+', em quanto tempo o capital de giro pode apertar e por quê?'},{label:'Plano de ação',q:'Monte um plano de ação prático para a '+c.nome+' aliviar a pressão de caixa combinada.'}]);};
    el.appendChild(d);
  }

  /* ---------- Gráficos (SVG puro, sem biblioteca externa) ---------- */
  function nfmt(v){return (Math.round(v*100)/100).toString().replace('.',',');}
  function svgBars(g){
    var W=300,H=150,pad=26,base=H-20,top=14,cats=g.cats,S=g.series;
    var max=0;S.forEach(function(s){s.vals.forEach(function(v){if(v>max)max=v;});});max=max*1.15||1;
    var gw=(W-pad*2)/cats.length,bw=Math.min(20,gw/(S.length+1));
    var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
    for(var t=0;t<=2;t++){var y=top+(base-top)*t/2;svg+='<line x1="'+pad+'" y1="'+y+'" x2="'+(W-6)+'" y2="'+y+'" stroke="rgba(232,32,46,.08)"/>';}
    cats.forEach(function(c,ci){var cx=pad+gw*ci+gw/2;
      S.forEach(function(s,si){var v=s.vals[ci],h=(base-top)*(v/max),x=cx-(S.length*bw)/2+si*bw,y=base-h;
        svg+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-3).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+s.cor+'" opacity="'+(si?.85:.9)+'"/>';
        svg+='<text x="'+(x+(bw-3)/2).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" fill="'+s.cor+'" font-size="8" text-anchor="middle" font-family="ui-monospace,monospace">'+nfmt(v)+'</text>';});
      svg+='<text x="'+cx.toFixed(1)+'" y="'+(H-4)+'" fill="#8fbfa8" font-size="9" text-anchor="middle">'+c+'</text>';});
    svg+='</svg>';
    var lg='<div class="lg">'+S.map(function(s){return '<span><i style="background:'+s.cor+'"></i>'+s.nome+'</span>';}).join('')+'</div>';
    return svg+lg;
  }
  function svgDonut(g){
    var parts=g.partes,tot=0;parts.forEach(function(p){tot+=p.val;});
    var R=52,r=32,cx=60,cy=64,a0=-Math.PI/2,svg='<svg viewBox="0 0 200 128" role="img">';
    parts.forEach(function(p){var frac=p.val/tot,a1=a0+frac*2*Math.PI,big=frac>.5?1:0;
      var x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
      var xi1=cx+r*Math.cos(a1),yi1=cy+r*Math.sin(a1),xi0=cx+r*Math.cos(a0),yi0=cy+r*Math.sin(a0);
      svg+='<path d="M'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+R+' '+R+' 0 '+big+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+' L'+xi1.toFixed(1)+' '+yi1.toFixed(1)+' A'+r+' '+r+' 0 '+big+' 0 '+xi0.toFixed(1)+' '+yi0.toFixed(1)+' Z" fill="'+p.cor+'" opacity=".9"/>';
      a0=a1;});
    svg+='<text x="'+cx+'" y="'+(cy-2)+'" fill="#ff5b64" font-size="13" text-anchor="middle" font-weight="700" font-family="ui-monospace,monospace">'+nfmt(tot)+'</text>';
    svg+='<text x="'+cx+'" y="'+(cy+11)+'" fill="#8fbfa8" font-size="8" text-anchor="middle">R$ mil</text>';
    parts.forEach(function(p,i){var y=30+i*26,pc=Math.round(p.val/tot*100);
      svg+='<rect x="120" y="'+(y-8)+'" width="10" height="10" rx="2" fill="'+p.cor+'"/>';
      svg+='<text x="135" y="'+y+'" fill="#eafff4" font-size="9">'+p.nome+'</text>';
      svg+='<text x="135" y="'+(y+10)+'" fill="#8fbfa8" font-size="8.5">R$ '+nfmt(p.val)+' mil · '+pc+'%</text>';});
    svg+='</svg>';return svg;
  }
  function renderCharts(){
    var c=co(),el=$('charts'),sec=$('chartsSec');
    if(!c.dados||!c.graf||!c.graf.length){el.style.display='none';sec.style.display='none';return;}
    el.style.display='grid';sec.style.display='flex';el.innerHTML='';
    c.graf.forEach(function(g){var d=document.createElement('div');d.className='chart';
      var body=g.tipo==='donut'?svgDonut(g):svgBars(g);
      d.innerHTML='<div class="ct">'+g.tit+'</div><div class="cv"><small>'+g.unid+'</small></div>'+body+'<div class="cta">toque para a análise do JARVIS ›</div>';
      d.onclick=function(){openDrawer('bi',g.tit+' · '+c.nome,g.q,[{label:'🔮 E a projeção?',q:g.q+' Depois projete o cenário para os próximos 6 a 12 meses com premissas explícitas.'},{label:'✅ O que fazer',q:'Com base em '+g.tit+' da '+c.nome+', quais as ações práticas recomendadas, priorizadas por impacto?'}]);};
      el.appendChild(d);});
  }

  function renderEmpresa(){
    $('coName').textContent=state.co;
    renderCore();renderKpis();renderAgents();renderCharts();renderAlerta();renderFeed();renderHoje();renderNote();
  }

  /* ---------- Visão Grupo ---------- */
  function renderGrupo(){
    var mon=ORDER.length,norm=0,aten=0,crit=0,sem=0;
    ORDER.forEach(function(k){var s=DATA[k].status;if(s==='ok')norm++;else if(s==='aten')aten++;else if(s==='crit')crit++;else sem++;});
    var gs=$('grpSum');gs.innerHTML='<div class="gchip"><div class="n">'+mon+'</div><div class="l">empresas monitoradas</div></div>'+
      '<div class="gchip"><div class="n" style="color:var(--aten)">'+aten+'</div><div class="l">requerem atenção</div></div>'+
      '<div class="gchip"><div class="n" style="color:var(--crit)">'+crit+'</div><div class="l">situação crítica</div></div>'+
      '<div class="gchip"><div class="n" style="color:var(--dim)">'+sem+'</div><div class="l">parcial / aguardando</div></div>';
    var cart=$('cart');cart.innerHTML='<div class="sec"><h2>Carteira do grupo</h2><span class="c">toque para abrir</span></div>';
    ORDER.forEach(function(k){var c=DATA[k];var row=document.createElement('div');row.className='crow';
      row.innerHTML='<span class="cst" style="background:'+STCOLOR[c.status]+';box-shadow:0 0 8px '+STCOLOR[c.status]+'"></span><span class="cn">'+c.nome+'</span><span class="cx">'+STLABEL[c.status]+'</span>';
      row.onclick=function(){state.grupo=false;state.co=k;applyMode();};cart.appendChild(row);});
    var ask=document.createElement('div');ask.className='crow';ask.style.borderColor='var(--line2)';
    ask.innerHTML='<span class="cst" style="background:var(--gold)"></span><span class="cn">Perguntar sobre a carteira</span><span class="cx">JARVIS</span>';
    ask.onclick=function(){openDrawer('est2','Carteira multiempresa','Considerando o grupo (SKAL com dados; KALFIX, QUIMIKA e FCK ainda sem dados), quais as prioridades e o que falta para eu ter a visão completa da carteira?',[{label:'Maior risco financeiro',q:'Quais empresas do grupo estão com maior risco financeiro hoje?'},{label:'5 decisões de hoje',q:'Quais as 5 decisões que eu deveria tomar hoje no grupo?'}]);};
    cart.appendChild(ask);
  }
  function applyMode(){
    if(state.grupo){$('grpBtn').classList.add('active');$('grpSum').classList.add('show');$('cart').classList.add('show');$('empView').style.display='none';renderGrupo();}
    else{$('grpBtn').classList.remove('active');$('grpSum').classList.remove('show');$('cart').classList.remove('show');$('empView').style.display='block';renderEmpresa();}
  }

  /* ---------- Seletor de empresa ---------- */
  $('selEmpresa').onclick=function(){
    drawer.innerHTML='<div class="dh"><div class="di"><svg viewBox="0 0 24 24">'+ICON.dir+'</svg></div><h3>Escolher empresa</h3><button class="x">✕</button></div><div id="coList"></div>';
    backdrop.classList.add('show');drawer.querySelector('.x').onclick=closeDrawer;
    var list=$('coList');ORDER.forEach(function(k){var c=DATA[k];var row=document.createElement('div');row.className='crow';row.style.marginBottom='8px';
      row.innerHTML='<span class="cst" style="background:'+STCOLOR[c.status]+'"></span><span class="cn">'+c.nome+'</span><span class="cx">'+STLABEL[c.status]+'</span>';
      row.onclick=function(){state.co=k;state.grupo=false;closeDrawer();applyMode();};list.appendChild(row);});
  };
  $('grpBtn').onclick=function(){state.grupo=!state.grupo;applyMode();};
  $('core').onclick=function(){unlockAudio();openDrawer('est2','Relatório integrado · '+state.co,'Aja como meu consultor sênior e gere o RELATÓRIO INTEGRADO da '+state.co+', consolidando TODAS as áreas (Financeiro, Cobrança, Fiscal, Contábil/Controladoria, RH, Comercial, Operações, Compliance). Estrutura: 1) **Painel de áreas** — uma tabela com cada área que tem dados, seu status (🟢/🟡/🔴) e o número-chave; 2) **Inteligência cruzada** — como as áreas se afetam (ex.: cobrança × caixa × permutas × fiscal); 3) **Diagnóstico consolidado**; 4) **3 alertas preditivos** com gatilho e ação; 5) conclua com "o que eu faria no seu lugar" em 2 ou 3 pontos. Use títulos e tabelas. Só use os números reais que você tem; onde faltar dado, diga o que falta.',[{label:'📊 Relatório executivo',q:'Gere um relatório executivo completo e formatado da '+state.co+', com seções (resultado, caixa/cobrança, fiscal, riscos), tabelas comparando os anos, projeção e próximos passos.'},{label:'🔮 Projeção 2026',q:'Projete 2026 da '+state.co+' (receita, lucro, margem e caixa) a partir da trajetória real, com premissas explícitas e cenários conservador, base e otimista, em tabela.'},{label:'⚠️ Riscos futuros',q:'Quais problemas podem surgir nos próximos 3 a 6 meses na '+state.co+'? Traga alertas preditivos com o gatilho a observar e a ação preventiva, priorizados por impacto em reais.'},{label:'✅ 5 decisões de hoje',q:'Quais as 5 decisões prioritárias que eu deveria tomar hoje na '+state.co+', com a evidência de cada uma?'}],chartFor('est2'));};

  /* ---------- Microfone ---------- */
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  $('mic').onclick=function(){unlockAudio();var m=this;
    if(SR){try{var rec=new SR();rec.lang='pt-BR';rec.interimResults=false;rec.maxAlternatives=1;m.classList.add('rec');tst('🎙️ Ouvindo…');
      rec.onresult=function(e){m.classList.remove('rec');var q=e.results[0][0].transcript;
        openDrawer('est2','Você perguntou','' , []);
        drawer.querySelector('h3').textContent='"'+q+'"';var resp=$('dResp');resp.className='resp think';resp.textContent='‹ consultando…';askBrain(q,function(t){resp.className='resp';resp.innerHTML=md(t);});};
      rec.onerror=function(){m.classList.remove('rec');tst('Não entendi, tente de novo');};rec.onend=function(){m.classList.remove('rec');};rec.start();return;
    }catch(e){}}
    openDrawer('est2','JARVIS','Me dê o resumo executivo do dia da '+state.co+'.',[]);};

  /* ---------- Partículas ---------- */
  (function(){var cv=$('particles'),cx=cv.getContext('2d'),ps=[],W,H;
   function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();addEventListener('resize',rs);
   for(var i=0;i<46;i++)ps.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,a:Math.random()*.5+.1});
   function tick(){cx.clearRect(0,0,W,H);for(var i=0;i<ps.length;i++){var p=ps[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fillStyle='rgba(232,32,46,'+p.a+')';cx.fill();}requestAnimationFrame(tick);}
   if(window.requestAnimationFrame)tick();})();

  /* ---------- Barra de voz tocável (replay garantido no toque) ---------- */
  // Barra de voz sem clique-para-ouvir (voz removida).

  /* ---------- Boot ---------- */
  applyMode();
  setTimeout(function(){vtxt('<b>JARVIS</b> · toque em um setor ou no microfone');},600);
})();
</script>
</body></html>
